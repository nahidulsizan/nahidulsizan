        50%, 100% { opacity: 0; }
      }
      .term-bg { fill: #0d0d0d; }
      .term-border { fill: none; stroke: #2a2a2a; stroke-width: 1.5; }
      .dot { }
      .title { fill: #cfcfcf; font-size: 13px; font-weight: 600; letter-spacing: .5px; }
      text { font-size: 9.2px; fill: url(#goldFade); white-space: pre; }
      .cursor { fill: #D4AF37; animation: blinkCursor 1s step-end infinite; }
